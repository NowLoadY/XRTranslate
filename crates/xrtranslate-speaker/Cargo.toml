[package]
name = "xrtranslate-speaker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native ERes2NetV2 speaker embeddings and bounded online speaker tracking."

[features]
default = []
managed-ort = ["ort/load-dynamic"]

[dependencies]
ndarray = "0.17"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "api-27"] }
