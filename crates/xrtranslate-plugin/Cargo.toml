[package]
autobins = false
name = "xrtranslate-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native plugin protocol, lifecycle and host-rendered controls"

[features]
host = ["dep:tempfile", "dep:log", "dep:toml"]
egui = ["dep:egui", "dep:ui-director", "dep:base64", "dep:flate2", "dep:rmp-serde", "dep:serde_bytes"]

[dependencies]
log = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
semver = "1"
egui = { version = "0.37", features = ["serde"], optional = true }
ui-director = { path = "../ui-director", features = ["egui"], optional = true }
base64 = { version = "0.22", optional = true }
flate2 = { version = "1", optional = true }
rmp-serde = { version = "1.3", optional = true }
serde_bytes = { version = "0.11", optional = true }
crossbeam-channel = "0.5"

tempfile = { version = "3", optional = true }
toml = { version = "1.1", optional = true }


[[bin]]
name = "xrt-plugin"
path = "src/bin/stage.rs"
required-features = ["host"]
