[package]
name = "xrtranslate-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "llama.cpp and OpenAI-compatible inference adapters for XRTranslate."

[features]
default = []
managed-ort = ["ort/load-dynamic"]

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.33"
half = "2.7.1"
ndarray = "0.17"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-native", "api-27", "half", "cuda", "preload-dylibs"] }
reqwest = { version = "0.13.4", features = ["json"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.47.1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
tracing = "0.1.41"
unicode_categories = "0.1.1"
uuid = { version = "1.18.1", features = ["v4"] }
xrtranslate-prompt = { path = "../xrtranslate-prompt" }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "io-util", "net"] }
tracing-subscriber = "0.3.20"
