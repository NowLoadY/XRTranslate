[package]
name = "xrtranslate-download"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Resumable artifact downloads for XRTranslate."

[dependencies]
httpdate = "1.0.3"
reqwest = { version = "0.13.4", features = ["stream", "socks"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "time", "rt"] }

[target.'cfg(target_os = "android")'.dependencies]
rustls = "0.23"
webpki-roots = "1"
