[package]
name = "xrtranslate-download"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Resumable artifact downloads for XRTranslate."

[dependencies]
xrtranslate-http = { path = "../xrtranslate-http" }
httpdate = "1.0.3"
reqwest = { version = "0.13.4", features = ["stream", "socks"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "time", "rt"] }
