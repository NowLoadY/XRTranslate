[package]
name = "ui-director"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Discoverable UI operations and observable execution for agents and native CLIs"
readme = "README.md"

[features]
default = []
egui = ["dep:egui", "dep:crossbeam-channel", "dep:log", "dep:uuid"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = { version = "0.37", default-features = false, features = ["bytemuck", "serde"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
log = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[[example]]
name = "basic"
required-features = ["egui"]
