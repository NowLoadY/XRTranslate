[package]
name = "xrtranslate-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Static local model manifests and preflight checks for XRTranslate."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.18.1", features = ["v4"] }
xrtranslate-download = { path = "../xrtranslate-download" }
xrtranslate-engine = { path = "../xrtranslate-engine" }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[build-dependencies]
serde_json = "1.0.151"
