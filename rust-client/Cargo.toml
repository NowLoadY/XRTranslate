[package]
name = "rust-client"
version.workspace = true
edition.workspace = true

[features]
# Keep the core client independent from native player libraries. Enable this
# capability for MPV playback and media-import fallback extraction.
default = []
mpv = ["dep:libmpv-sys"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
cpal = "0.18.1"
crossbeam-channel = "0.5.16"
eframe = "0.36.1"
flate2 = "1.1.9"
egui_extras = { version = "0.36.1", features = ["svg", "image"] }
env_logger = "0.11.11"
futures = "0.3.33"
log = "0.4.33"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", features = ["json", "socks"] }
rfd = "0.17.2"
rubato = "4.0.0"
audioadapter-buffers = "4.0.0"
rosc = "0.11.4"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"
uuid = { version = "1.18.1", features = ["v4"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
xrtranslate-assets = { path = "../crates/xrtranslate-assets" }
xrtranslate-config = { path = "../crates/xrtranslate-config" }
xrtranslate-download = { path = "../crates/xrtranslate-download" }
xrtranslate-engine = { path = "../crates/xrtranslate-engine" }
xrtranslate-prompt = { path = "../crates/xrtranslate-prompt" }
xrtranslate-protocol = { path = "../crates/xrtranslate-protocol" }
libmpv-sys = { version = "3.1.0", optional = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
wasapi = "0.23.0"
winit = "0.30.13"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_Threading"] }
windows = { version = "0.60.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
] }

[build-dependencies]
winres = "0.1.12"
