[package]
name = "rust-client"
version.workspace = true
edition.workspace = true

[features]
# Keep the core client independent from native player libraries. Enable this
# capability for MPV playback and media-import fallback extraction.
default = []
mpv = ["dep:libmpv-sys"]

[dependencies]
tempfile = "3.27"
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
xr-corpus-client = { path = "../XR-Corpus/crates/client" }
bytemuck = { version = "1.25", features = ["derive"] }
cpal = "0.18.1"
crossbeam-channel = "0.5.16"
flate2 = "1.1.9"
egui_extras = { version = "0.36.1", features = ["svg", "image"] }
env_logger = "0.11.11"
futures = "0.3.33"
glam = { version = "0.33.10", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
log = "0.4.33"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", features = ["json", "socks"] }
rubato = "4.0.0"
audioadapter-buffers = "4.0.0"
rosc = "0.11.4"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"
unicode-segmentation = "1.13.3"
uuid = { version = "1.18.1", features = ["v4"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
xrtranslate-assets = { path = "../crates/xrtranslate-assets" }
xrtranslate-config = { path = "../crates/xrtranslate-config" }
xrtranslate-download = { path = "../crates/xrtranslate-download" }
xrtranslate-engine = { path = "../crates/xrtranslate-engine" }
xrtranslate-prompt = { path = "../crates/xrtranslate-prompt" }
xrtranslate-protocol = { path = "../crates/xrtranslate-protocol" }
libmpv-sys = { version = "3.1.0", optional = true }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
raw-window-handle = "0.6.2"
winit = "0.30.13"
base64 = "0.22.1"
oar-ocr = { version = "0.9.2", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
serde_yaml_ng = "0.10"
xrtranslate-supervisor = { path = "../crates/xrtranslate-supervisor" }

[target.'cfg(windows)'.dependencies]
wasapi = "0.23.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading"] }
windows = { version = "0.60.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.1", features = ["glow"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast"] }
pipewire = "0.10.1"
libloading = "0.8.9"
x11rb = { version = "0.13.2", features = ["shape", "randr"] }

[build-dependencies]
winres = "0.1.12"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.36.1"
rfd = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu", "android-game-activity", "links"] }
winit = { version = "0.30.13", features = ["android-game-activity"] }
android-activity = { version = "0.6.1", features = ["game-activity"] }
android_logger = "0.15.1"
libc = "0.2"
jni = "0.21.1"
