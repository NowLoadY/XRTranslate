[package]
name = "xrt-vr-overlay"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
xrtranslate-client-core = { path = "../../crates/xrtranslate-client-core" }
xrtranslate-plugin = { path = "../../crates/xrtranslate-plugin", features = ["egui"] }
xrtranslate-protocol = { path = "../../crates/xrtranslate-protocol" }
ui-director = { path = "../../crates/ui-director", features = ["egui"] }
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
glam = { version = "0.33.10", default-features = false, features = ["std"] }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.60", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
