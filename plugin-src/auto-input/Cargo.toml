[package]
name = "xrt-auto-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
xrtranslate-plugin = { path = "../../crates/xrtranslate-plugin" }
serde_json = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }
windows = { version = "0.60.0", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
