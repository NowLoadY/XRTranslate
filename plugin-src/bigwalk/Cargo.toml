[package]
name = "xrt-bigwalk"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
xrtranslate-plugin = { path = "../../crates/xrtranslate-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
unicode-segmentation = "1.13.3"
uuid = { version = "1", features = ["v4"] }
