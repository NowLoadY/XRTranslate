[package]
name = "xrt-meeting"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
xrtranslate-client-core = { path = "../../crates/xrtranslate-client-core" }
xrtranslate-plugin = { path = "../../crates/xrtranslate-plugin", features = ["egui"] }
xrtranslate-engine = { path = "../../crates/xrtranslate-engine" }
xrtranslate-protocol = { path = "../../crates/xrtranslate-protocol" }
xrtranslate-prompt = { path = "../../crates/xrtranslate-prompt" }
ui-director = { path = "../../crates/ui-director", features = ["egui"] }
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
