[package]
name = "xrt-meeting"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
xrtranslate-client-core = { version = "0.4.0" }
xrtranslate-plugin = { version = "0.1.0", features = ["egui"] }
xrtranslate-engine = { version = "0.4.0" }
xrtranslate-protocol = { version = "0.4.0" }
xrtranslate-prompt = { version = "0.4.0" }
ui-director = { version = "0.0.1", features = ["egui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.xrtranslate]
android = true

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.37"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "android-game-activity", "links"] }
