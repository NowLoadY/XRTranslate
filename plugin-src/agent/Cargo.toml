[package]
name = "xrt-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
xrtranslate-plugin = { path = "../../crates/xrtranslate-plugin" }
xrtranslate-protocol = { path = "../../crates/xrtranslate-protocol" }
xrtranslate-prompt = { path = "../../crates/xrtranslate-prompt" }
ui-director = { path = "../../crates/ui-director" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
tempfile = "3"
log = "0.4"
env_logger = "0.11"
