[package]
name = "xrt-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
xrtranslate-plugin = { version = "0.1.0" }
xrtranslate-protocol = { version = "0.4.0" }
xrtranslate-prompt = { version = "0.4.0" }
ui-director = { version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
tempfile = "3"
log = "0.4"
env_logger = "0.11"

[package.metadata.xrtranslate]
android = true
