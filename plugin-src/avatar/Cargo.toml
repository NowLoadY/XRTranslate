[package]
name = "xrt-avatar"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"

[dependencies]
xrtranslate-plugin = { path = "../../crates/xrtranslate-plugin", features = ["egui"] }
xrtranslate-client-core = { path = "../../crates/xrtranslate-client-core" }
xrtranslate-prompt = { path = "../../crates/xrtranslate-prompt" }
xrt-connector-core = { git = "https://github.com/NowLoadY/XRT-Avatar-Plugin.git", rev = "a01af88f7d37263e50b2daa67ca742e353601a80" }
eframe = "0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12.5"
tungstenite = "0.30.0"
ui-director = { path = "../../crates/ui-director", features = ["egui"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"

crossbeam-channel = "0.5.16"
