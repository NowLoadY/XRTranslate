[package]
name = "xrt-avatar"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"

[dependencies]
xrtranslate-plugin = { version = "0.1.0", features = ["egui"] }
xrtranslate-client-core = { version = "0.4.0" }
xrtranslate-prompt = { version = "0.4.0" }
xrt-connector-core = { git = "https://github.com/NowLoadY/XRT-Avatar-Plugin.git", rev = "eeef3ef5783711b7558258bc5880f3deacb2980a" }
eframe = "0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12.5"
tungstenite = "0.30.0"
ui-director = { version = "0.0.1", features = ["egui"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"

crossbeam-channel = "0.5.16"
