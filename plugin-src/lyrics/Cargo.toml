[package]
name = "xrt-lyrics"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tempfile = "3"
xrtranslate-plugin = { version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
reqwest = { version = "0.13.4", features = ["json", "socks"] }
unicode-segmentation = "1.13.3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.18.0", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies]
windows-future = "0.1.1"
windows = { version = "0.60.0", features = ["Foundation", "Media_Control", "Win32_System_WinRT"] }
