[package]
name = "xrt-osc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xrtranslate-client-core = { version = "0.4.0" }
xrtranslate-plugin = { version = "0.1.0", features = ["egui"] }
xrtranslate-protocol = { version = "0.4.0" }
xrtranslate-engine = { version = "0.4.0" }
ui-director = { version = "0.0.1", features = ["egui"] }
eframe = "0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
rosc = "0.11.4"
crossbeam-channel = "0.5.16"
unicode-segmentation = "1.13"
