[workspace]
resolver = "3"
members = [
    "rust-client",
    "crates/xrtranslate-prompt",
    "crates/xrtranslate-protocol",
    "crates/xrtranslate-config",
    "crates/xrtranslate-download",
    "crates/xrtranslate-engine",
    "crates/xrtranslate-inference",
    "crates/xrtranslate-assets",
    "crates/xrtranslate-speaker",
    "crates/xrtranslate-vad",
    "crates/xrtranslate-denoise",
    "crates/xrtranslate-supervisor",
    "apps/xrtranslate-backend",
    "apps/xrtranslate-installer",
    "apps/xrtranslate-packager",
    "apps/xrtranslate-updater",
]

[workspace.package]
version = "0.2.9-beta.2"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/NowLoadY/XRTranslate"

# Keep useful file/line backtraces without retaining full debugger metadata.
# Development remains incremental; test artifacts favor bounded disk usage.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
incremental = false

[patch.crates-io]
winit = { path = "third_party/winit" }
